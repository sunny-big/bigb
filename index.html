<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>优秀小组荣誉榜</title>
    <style>
        /* 基础全屏样式：确保背景无空隙 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: "微软雅黑", sans-serif;
            background-color: #F5D76E; /* 兜底色，避免背景图加载前空白 */
            background-image: url("bg-desktop.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }

        /* 响应式背景：手机端同步全屏 */
        @media (max-width: 768px) {
            body {
                background-image: url("bg-mobile.jpg");
            }
        }

        /* 标题样式 */
        .title {
            font-size: 42px;
            color: #fff;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
            margin-bottom: 20px;
            text-align: center;
            z-index: 5;
        }
        @media (max-width: 768px) {
            .title { font-size: 28px; }
        }

        /* 启动按钮 */
        .start-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            border: 3px solid #fff;
            padding: 18px 45px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 20px #FFD700;
            transition: all 0.3s;
            margin: 20px 0;
            z-index: 100;
        }
        @media (max-width: 768px) {
            .start-btn { font-size: 20px; padding: 15px 40px; }
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #FFD700; }
        .start-btn.hide { display: none; }

        /* 音乐提示 */
        .music-tip {
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 8px #000;
            margin: 10px 0;
            text-align: center;
            display: none;
            z-index: 5;
        }
        .music-tip.show { display: block; }

        /* 解说词 */
        .comment {
            font-size: 26px;
            color: #fff;
            padding: 10px 0;
            margin: 0 auto 20px;
            width: 80%;
            text-align: center;
            min-height: 70px;
            line-height: 1.5;
            text-shadow: 0 0 8px #000, 0 0 12px rgba(0,0,0,0.8);
            z-index: 5;
        }
        @media (max-width: 768px) {
            .comment { font-size: 18px; width: 95%; }
        }

        /* 勋章容器：合并响应式布局 */
        #medalContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;
            flex-wrap: nowrap;
            z-index: 5;
        }
        @media (max-width: 768px) {
            #medalContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 0 10px;
            }
        }

        /* 勋章样式：优化加载失败兜底（关键！避免问号） */
        .medal {
            width: 250px;
            height: 250px;
            border: 10px solid #FFD700;
            border-radius: 50%;
            overflow: hidden;
            margin: 15px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s;
            box-shadow: 0 0 15px #FFD700;
            /* 加载失败时显示金色背景+文字，替代默认问号 */
            background-color: #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            text-align: center;
            padding: 10px;
        }
        @media (max-width: 768px) {
            .medal { 
                width: 150px; 
                height: 150px; 
                border-width: 6px; 
                margin: 10px 0; 
                font-size: 12px;
            }
        }
        .medal.flash { animation: flash 1s infinite alternate; }
        .medal.show { opacity: 1; transform: scale(1); }
        /* 图片加载成功后覆盖背景色 */
        .medal img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 确保图片填满圆形，不拉伸 */
        }
        @keyframes flash {
            from { box-shadow: 0 0 15px #FFD700; }
            to { box-shadow: 0 0 30px #FFD700, 0 0 40px #FFA500; }
        }

        /* 姓名标签 */
        .medalWrap { margin: 0 10px; text-align: center; }
        @media (max-width: 768px) { .medalWrap { margin: 0; } }
        .name {
            font-size: 22px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 0 0 5px #000;
        }
        @media (max-width: 768px) { .name { font-size: 16px; } }

        /* 内容容器：确保层级 */
        .content-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1 class="title">优秀小组荣誉榜</h1>
        <button class="start-btn" id="startBtn">点击公布名单</button>
        <div class="music-tip" id="musicTip">若未听到音乐，请再点击页面任意位置</div>
        <div class="comment" id="comment"></div>
        <div id="medalContainer"></div>
    </div>

    <script>
        const config = {
            commentParts: [
                "本周课堂表现和作业表现好的小组是陈依菲小组，",
                "小组成员如下：",
                "组长：陈依菲，",
                "成员：何胜新、",
                "孔傲雪、",
                "蒋佳妍"
            ],
            // 关键：图片路径必须和HTML在同一文件夹，文件名严格匹配（全小写，无空格）
            medalImages: ["1.jpg", "2.jpg", "3.jpg", "4.jpg"],
            medalNames: ["陈依菲", "何胜新", "孔傲雪", "蒋佳妍"],
            musicPath: "music.mp3",
            typeSpeed: 100
        };

        window.onload = function() {
            const startBtn = document.getElementById("startBtn");
            const commentElem = document.getElementById("comment");
            const medalContainer = document.getElementById("medalContainer");
            const musicTip = document.getElementById("musicTip");
            let isStarted = false;
            let musicElem;

            // 启动逻辑
            startBtn.addEventListener("click", function() {
                if (isStarted) return;
                isStarted = true;
                startBtn.classList.add("hide");
                
                // 初始化音乐
                musicElem = new Audio(config.musicPath);
                musicElem.play().then(() => musicTip.classList.remove("show"))
                .catch(() => {
                    musicTip.classList.add("show");
                    document.body.addEventListener("click", playMusicOnce, { once: true });
                });

                // 启动解说词
                startTypewriter(0);
            });

            // 音乐二次播放
            function playMusicOnce() {
                musicElem.play().then(() => musicTip.classList.remove("show"))
                .catch(() => musicTip.textContent = "音乐加载失败，可正常查看荣誉榜");
            }

            // 打字机效果
            function startTypewriter(partIndex) {
                const text = config.commentParts[partIndex];
                let charIdx = 0;
                const originContent = commentElem.textContent;

                const timer = setInterval(() => {
                    commentElem.textContent = originContent + text.slice(0, ++charIdx);
                    if (charIdx >= text.length) {
                        clearInterval(timer);
                        handleNextStep(partIndex);
                    }
                }, config.typeSpeed);
            }

            // 步骤控制
            function handleNextStep(partIndex) {
                const delay = partIndex < 2 ? 1000 : 1500;
                setTimeout(() => {
                    if (partIndex >= 2) createMedal(partIndex - 2); // 勋章索引对应
                    if (partIndex < 5) startTypewriter(partIndex + 1);
                }, delay);
            }

            // 勋章创建：移除复杂懒加载，本地直接加载（关键修复！）
            function createMedal(medalIndex) {
                const wrap = document.createElement("div");
                wrap.className = "medalWrap";

                // 勋章容器（加载失败时显示文字）
                const medalBox = document.createElement("div");
                medalBox.className = "medal flash";
                medalBox.textContent = config.medalNames[medalIndex]; // 加载失败时显示姓名

                // 勋章图片：本地直接加载，不做懒加载（本地文件加载≈内存读取，懒加载反而拖慢）
                const img = document.createElement("img");
                img.src = config.medalImages[medalIndex]; // 直接加载本地图片
                img.alt = config.medalNames[medalIndex];

                // 图片加载成功：插入容器，覆盖文字
                img.onload = function() {
                    medalBox.innerHTML = ""; // 清空文字
                    medalBox.appendChild(img); // 插入图片
                };

                // 图片加载失败：显示明确提示（方便排查）
                img.onerror = function() {
                    medalBox.textContent = `${config.medalNames[medalIndex]}\n(图片加载失败)`;
                    console.log("图片加载失败：请检查文件是否存在/路径是否正确，文件名：", config.medalImages[medalIndex]);
                };

                // 姓名标签
                const name = document.createElement("div");
                name.className = "name";
                name.textContent = config.medalNames[medalIndex];

                // 组装
                wrap.append(medalBox, name);
                medalContainer.appendChild(wrap);
                setTimeout(() => medalBox.classList.add("show"), 100);
            }
        };
    </script>
</body>
</html>
