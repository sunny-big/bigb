<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机适配核心：禁止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 缓存优化：让微信浏览器缓存资源1天，减少重复下载 -->
    <meta http-equiv="Cache-Control" content="max-age=86400, public">
    <title>优秀小组荣誉榜</title>
    <style>
        /* 基础样式：电脑端默认（金色调风格保留） */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: "微软雅黑", sans-serif;
            /* 电脑端背景图（已压缩的大屏图） */
            background-image: url("bg-desktop.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 215, 0, 0.3);
            background-blend-mode: overlay;
        }
        .title {
            font-size: 42px;
            color: #fff;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
            margin-bottom: 20px;
            text-align: center;
        }
        .start-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            border: none;
            padding: 18px 45px;
            font-size: 26px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #FFD700;
            transition: all 0.3s;
            margin: 30px 0;
            z-index: 10;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #FFD700, 0 0 35px #FFA500;
        }
        .start-btn.hide {
            display: none;
        }
        .comment {
            font-size: 26px;
            color: #fff;
            padding: 10px 0;
            margin: 0 auto 30px;
            width: 80%;
            text-align: center;
            min-height: 70px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px #000, 0 0 12px rgba(0,0,0,0.8);
        }
        /* 勋章容器：电脑端一排显示 */
        #medalContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
        }
        .medal {
            width: 250px;
            height: 250px;
            border: 10px solid #FFD700;
            border-radius: 50%;
            overflow: hidden;
            margin: 20px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s;
            box-shadow: 0 0 15px #FFD700;
        }
        .medalWrap {
            margin: 0 20px;
            text-align: center;
        }
        /* 勋章闪烁动画 */
        @keyframes flash {
            from { box-shadow: 0 0 15px #FFD700; }
            to { box-shadow: 0 0 30px #FFD700, 0 0 40px #FFA500; }
        }
        .medal.flash {
            animation: flash 1s infinite alternate;
        }
        .medal.show {
            opacity: 1;
            transform: scale(1);
        }
        .name {
            font-size: 22px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 0 0 5px #000;
        }
        .content-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 手机端适配（加载提速+两排布局） */
        @media (max-width: 768px) {
            body {
                /* 手机端背景图（已压缩的竖屏图） */
                background-image: url("bg-mobile.jpg");
            }
            .title {
                font-size: 28px;
            }
            .start-btn {
                font-size: 18px;
                padding: 12px 30px;
            }
            .comment {
                font-size: 18px;
                width: 95%;
            }
            /* 勋章容器：手机端两排显示 */
            #medalContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 0 10px;
            }
            .medal {
                width: 150px;
                height: 150px;
                border-width: 6px;
                margin: 10px 0;
            }
            .medalWrap {
                margin: 0;
            }
            .name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1 class="title">优秀小组荣誉榜</h1>
        <button class="start-btn" id="startBtn">点击公布名单</button>
        <div class="comment" id="comment"></div>
        <div id="medalContainer"></div>
    </div>

    <script>
        // 可修改配置（每周更新只需改这里）
        const config = {
            commentParts: [
                "本周课堂表现和作业表现比较好的小组是陈依菲小组，",
                "小组成员如下：",
                "组长：陈依菲，",
                "成员：何胜新、",
                "孔傲雪、",
                "蒋佳妍"
            ],
            medalImages: ["1.jpg", "2.jpg", "3.jpg", "4.jpg"], // 组长→成员顺序
            medalNames: ["陈依菲", "何胜新", "孔傲雪", "蒋佳妍"],
            musicPath: "music.mp3", // 已压缩的MP3
            typeSpeed: 100,
            lazyLoadPlaceholder: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" // 轻量占位图
        };

        window.onload = function() {
            const startBtn = document.getElementById("startBtn");
            const commentElem = document.getElementById("comment");
            const medalContainer = document.getElementById("medalContainer");
            let isStarted = false;

            // 点击按钮触发：延迟加载音乐+启动流程（核心提速点）
            startBtn.addEventListener("click", function() {
                if (isStarted) return;
                isStarted = true;
                startBtn.classList.add("hide");

                // 1. 延迟加载音乐（用户点击后再创建，不占用首屏资源）
                loadMusic();

                // 2. 启动打字机流程
                startTypewriter(0);
            });

            /** 音乐延迟加载：避免首屏资源竞争 */
            function loadMusic() {
                const musicElem = new Audio(config.musicPath);
                // 尝试播放（兼容微信授权）
                musicElem.play().catch(err => {
                    alert("音乐需要授权，再点击页面任意位置即可播放");
                    document.body.addEventListener("click", function playOnClick() {
                        musicElem.play().then(() => {
                            document.body.removeEventListener("click", playOnClick);
                        }).catch(err2 => {
                            alert("音乐播放失败，可忽略继续查看荣誉榜");
                            document.body.removeEventListener("click", playOnClick);
                        });
                    }, { once: true });
                });
            }

            /** 打字机函数：逐字符显示 */
            function startTypewriter(partIndex) {
                const currentText = config.commentParts[partIndex];
                let charIndex = 0;
                const originalContent = commentElem.textContent;

                const typeTimer = setInterval(() => {
                    commentElem.textContent = originalContent + currentText.slice(0, charIndex + 1);
                    charIndex++;

                    if (charIndex >= currentText.length) {
                        clearInterval(typeTimer);
                        handleAfterType(partIndex);
                    }
                }, config.typeSpeed);
            }

            /** 打字后逻辑：同步显示勋章（懒加载） */
            function handleAfterType(partIndex) {
                switch (partIndex) {
                    case 0:
                        setTimeout(() => startTypewriter(1), 1000);
                        break;
                    case 1:
                        setTimeout(() => startTypewriter(2), 1000);
                        break;
                    case 2:
                        createMedal(0); // 组长勋章
                        setTimeout(() => startTypewriter(3), 1500);
                        break;
                    case 3:
                        createMedal(1); // 成员1勋章
                        setTimeout(() => startTypewriter(4), 2000);
                        break;
                    case 4:
                        createMedal(2); // 成员2勋章
                        setTimeout(() => startTypewriter(5), 2000);
                        break;
                    case 5:
                        createMedal(3); // 成员3勋章
                        break;
                }
            }

            /** 勋章懒加载：进入可视区域才加载真实图片（核心提速点） */
            function createMedal(medalIndex) {
                const medalWrap = document.createElement("div");
                medalWrap.className = "medalWrap";

                // 1. 创建勋章图片容器
                const medalElem = document.createElement("img");
                // 占位图（体积<1KB，快速加载）
                medalElem.src = config.lazyLoadPlaceholder;
                // 真实图片地址存放在data-src（不立即加载）
                medalElem.dataset.src = config.medalImages[medalIndex];
                medalElem.className = "medal flash";
                medalElem.alt = config.medalNames[medalIndex];

                // 图片加载失败提示
                medalElem.onerror = function() {
                    this.src = config.lazyLoadPlaceholder;
                    this.alt = `图片加载失败：${config.medalNames[medalIndex]}`;
                };

                // 2. 监听图片是否进入可视区域（进入后加载真实图片）
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            // 加载真实图片
                            medalElem.src = medalElem.dataset.src;
                            // 停止监听
                            observer.unobserve(medalElem);
                        }
                    });
                }, { rootMargin: "200px 0px" }); // 提前200px开始加载，避免延迟

                observer.observe(medalElem);

                // 3. 创建姓名标签
                const nameElem = document.createElement("div");
                nameElem.className = "name";
                nameElem.textContent = config.medalNames[medalIndex];

                // 4. 组装元素
                medalWrap.appendChild(medalElem);
                medalWrap.appendChild(nameElem);
                medalContainer.appendChild(medalWrap);

                // 勋章显示动画
                setTimeout(() => medalElem.classList.add("show"), 100);
            }
        };
    </script>
</body>
</html>
