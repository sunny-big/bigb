<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 缓存优化：二次打开秒加载 -->
    <meta http-equiv="Cache-Control" content="max-age=86400, public">
    <title>优秀小组荣誉榜</title>
    <style>
        /* 首屏样式优先加载：确保背景图和核心元素快速渲染 */
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: "微软雅黑", sans-serif;
            /* 首屏背景图：必须压缩（电脑端≤500KB，手机端≤300KB），确保快速加载 */
            background-image: url("bg-desktop.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 215, 0, 0.3);
            background-blend-mode: overlay;
            /* 禁止背景图延迟加载，强制优先渲染 */
            background-attachment: initial;
        }
        .title {
            font-size: 42px;
            color: #fff;
            text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
            margin-bottom: 20px;
            text-align: center;
            /* 标题优先显示，不等待其他资源 */
            opacity: 1 !important;
        }
        .start-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
            border: none;
            padding: 18px 45px;
            font-size: 26px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px #FFD700;
            transition: all 0.3s;
            margin: 30px 0;
            z-index: 10;
            /* 按钮优先渲染 */
            opacity: 1 !important;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #FFD700, 0 0 35px #FFA500;
        }
        .start-btn.hide {
            display: none;
        }
        /* 音乐加载提示：避免用户以为没音乐 */
        .music-loading {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #000;
            display: none;
        }
        .music-loading.show {
            display: block;
        }
        .comment {
            font-size: 26px;
            color: #fff;
            padding: 10px 0;
            margin: 0 auto 30px;
            width: 80%;
            text-align: center;
            min-height: 70px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px #000, 0 0 12px rgba(0,0,0,0.8);
        }
        /* 电脑端勋章：一排显示（非首屏，可延迟加载） */
        #medalContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
        }
        .medal {
            width: 250px;
            height: 250px;
            border: 10px solid #FFD700;
            border-radius: 50%;
            overflow: hidden;
            margin: 20px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s;
            box-shadow: 0 0 15px #FFD700;
        }
        .medalWrap {
            margin: 0 20px;
            text-align: center;
        }
        @keyframes flash {
            from { box-shadow: 0 0 15px #FFD700; }
            to { box-shadow: 0 0 30px #FFD700, 0 0 40px #FFA500; }
        }
        .medal.flash {
            animation: flash 1s infinite alternate;
        }
        .medal.show {
            opacity: 1;
            transform: scale(1);
        }
        .name {
            font-size: 22px;
            color: #fff;
            margin-top: 10px;
            text-shadow: 0 0 5px #000;
        }
        .content-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 手机端：首屏背景+音乐优先，勋章两排 */
        @media (max-width: 768px) {
            body {
                background-image: url("bg-mobile.jpg"); /* 手机端背景图（压缩后≤300KB） */
            }
            .title {
                font-size: 28px;
            }
            .start-btn {
                font-size: 18px;
                padding: 12px 30px;
            }
            .comment {
                font-size: 18px;
                width: 95%;
            }
            #medalContainer {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 0 10px;
            }
            .medal {
                width: 150px;
                height: 150px;
                border-width: 6px;
                margin: 10px 0;
            }
            .medalWrap {
                margin: 0;
            }
            .name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="content-container">
        <h1 class="title">优秀小组荣誉榜</h1>
        <!-- 音乐加载提示：让用户知道音乐在准备 -->
        <div class="music-loading" id="musicLoading">音乐加载中...</div>
        <button class="start-btn" id="startBtn">点击公布名单</button>
        <div class="comment" id="comment"></div>
        <div id="medalContainer"></div>
    </div>

    <script>
        const config = {
            commentParts: [
                "本周课堂表现和作业表现比较好的小组是陈依菲小组，",
                "小组成员如下：",
                "组长：陈依菲，",
                "成员：何胜新、",
                "孔傲雪、",
                "蒋佳妍"
            ],
            medalImages: ["1.jpg", "2.jpg", "3.jpg", "4.jpg"], // 勋章图（非首屏，可懒加载）
            medalNames: ["陈依菲", "何胜新", "孔傲雪", "蒋佳妍"],
            musicPath: "music.mp3", // 音乐必须压缩（≤1MB，128kbps）
            typeSpeed: 100,
            lazyLoadPlaceholder: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" // 勋章占位图
        };

        window.onload = function() {
            const startBtn = document.getElementById("startBtn");
            const commentElem = document.getElementById("comment");
            const medalContainer = document.getElementById("medalContainer");
            const musicLoading = document.getElementById("musicLoading");
            let isStarted = false;

            // 核心：页面加载时立即初始化音乐（预加载，不立即播放）
            const musicElem = new Audio(config.musicPath);
            // 开启音乐预加载，浏览器会在后台加载，不阻塞首屏
            musicElem.preload = "auto";
            // 监听音乐加载状态，显示/隐藏加载提示
            musicElem.addEventListener("loadeddata", function() {
                musicLoading.classList.remove("show"); // 加载完成，隐藏提示
            });
            musicElem.addEventListener("error", function() {
                musicLoading.textContent = "音乐加载失败，点击仍可查看荣誉榜";
            });

            // 首屏加载完成后，显示音乐加载提示（仅加载慢时显示）
            setTimeout(() => {
                if (musicElem.readyState < 2) { // 音乐未加载完成
                    musicLoading.classList.add("show");
                }
            }, 500);

            // 点击按钮：立即播放音乐（此时音乐大概率已预加载完成）
            startBtn.addEventListener("click", function() {
                if (isStarted) return;
                isStarted = true;
                startBtn.classList.add("hide");
                musicLoading.classList.remove("show");

                // 播放音乐（兼容微信授权）
                musicElem.play().catch(err => {
                    alert("请点击页面任意位置开启音乐");
                    document.body.addEventListener("click", function playOnClick() {
                        musicElem.play().then(() => {
                            document.body.removeEventListener("click", playOnClick);
                        }).catch(err2 => {
                            alert("音乐授权失败，可继续查看荣誉榜");
                            document.body.removeEventListener("click", playOnClick);
                        });
                    }, { once: true });
                });

                // 启动打字机流程
                startTypewriter(0);
            });

            /** 打字机函数 */
            function startTypewriter(partIndex) {
                const currentText = config.commentParts[partIndex];
                let charIndex = 0;
                const originalContent = commentElem.textContent;

                const typeTimer = setInterval(() => {
                    commentElem.textContent = originalContent + currentText.slice(0, charIndex + 1);
                    charIndex++;

                    if (charIndex >= currentText.length) {
                        clearInterval(typeTimer);
                        handleAfterType(partIndex);
                    }
                }, config.typeSpeed);
            }

            /** 打字后：显示勋章（非首屏，懒加载不影响速度） */
            function handleAfterType(partIndex) {
                switch (partIndex) {
                    case 0:
                        setTimeout(() => startTypewriter(1), 1000);
                        break;
                    case 1:
                        setTimeout(() => startTypewriter(2), 1000);
                        break;
                    case 2:
                        createMedal(0); // 组长勋章
                        setTimeout(() => startTypewriter(3), 1500);
                        break;
                    case 3:
                        createMedal(1); // 成员1勋章
                        setTimeout(() => startTypewriter(4), 2000);
                        break;
                    case 4:
                        createMedal(2); // 成员2勋章
                        setTimeout(() => startTypewriter(5), 2000);
                        break;
                    case 5:
                        createMedal(3); // 成员3勋章
                        break;
                }
            }

            /** 勋章懒加载：非首屏资源，延迟加载不影响首屏速度 */
            function createMedal(medalIndex) {
                const medalWrap = document.createElement("div");
                medalWrap.className = "medalWrap";

                const medalElem = document.createElement("img");
                medalElem.src = config.lazyLoadPlaceholder; // 占位图（1KB）
                medalElem.dataset.src = config.medalImages[medalIndex]; // 真实勋章图
                medalElem.className = "medal flash";
                medalElem.alt = config.medalNames[medalIndex];

                medalElem.onerror = function() {
                    this.src = config.lazyLoadPlaceholder;
                    this.alt = `图片加载失败：${config.medalNames[medalIndex]}`;
                };

                // 进入可视区域再加载真实勋章图
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            medalElem.src = medalElem.dataset.src;
                            observer.unobserve(medalElem);
                        }
                    });
                }, { rootMargin: "200px 0px" });

                observer.observe(medalElem);

                const nameElem = document.createElement("div");
                nameElem.className = "name";
                nameElem.textContent = config.medalNames[medalIndex];

                medalWrap.appendChild(medalElem);
                medalWrap.appendChild(nameElem);
                medalContainer.appendChild(medalWrap);

                setTimeout(() => medalElem.classList.add("show"), 100);
            }
        };
    </script>
</body>
</html>
